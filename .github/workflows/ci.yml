name: CI
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Match package.json's engines.node (>=22.0.0) — the published build
        # targets node22 and relies on Node's own dual ESM/CJS exports
        # resolution, both untested by older runtimes. The upper bound guards
        # against regressions on current Node.
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting and lint
        run: yarn lint

      - name: Check types
        run: yarn typecheck

      - name: Run tests with coverage
        # No explicit grammar step: `pretest:coverage` regenerates
        # src/_grammars/rfc4512.generated.js, which is a build artifact and not
        # checked in. `bun test` bypassed npm script lifecycle hooks and forced
        # a separate step here; yarn honours them.
        run: yarn test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacxou/parser_ldap_rfc4512
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build
