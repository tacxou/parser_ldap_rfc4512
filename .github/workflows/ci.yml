name: CI
permissions:
  contents: read

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Match package.json's engines.node (>=22.0.0) — the published build
        # targets node22 and relies on Node's own dual ESM/CJS exports
        # resolution, both untested by older runtimes. The upper bound guards
        # against regressions on current Node.
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting and lint
        run: yarn lint

      - name: Check types
        run: yarn typecheck

      - name: Run tests with coverage
        # No explicit grammar step: `pretest:coverage` regenerates
        # src/_grammars/rfc4512.generated.js, which is a build artifact and not
        # checked in. `bun test` bypassed npm script lifecycle hooks and forced
        # a separate step here; yarn honours them.
        run: yarn test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacxou/parser_ldap_rfc4512
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Test project tooling
        run: yarn test:scripts

      - name: Build documentation
        run: yarn docs:build

      - name: Build and audit npm tarball
        run: yarn package:check
